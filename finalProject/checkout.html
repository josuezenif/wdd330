<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentía Fashion Mode</title>

    <link rel="stylesheet" href="css/index.css">

    <script src="js/time.js" defer></script>
    <script src="js/checkout.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+NZ+Guides&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="icon" href="images/favicon.png">
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html" class="fashion-logo"><img src="images/transparent-logo.jpg" alt="Fashion Logo"
                    width="1254" height="1254"></a>
        </div>

        <a href="index.html" class="name">Valentía Fashion Mode</a>

        <div class="cart">
            <a href="/wdd330/finalProject/cart.html"><img src="images/grocery-store.svg"
                    alt="Cart image for cart page"></a>
        </div>
    </header>

    <main>
        <h1>Checkout Payment</h1>
        <p class="checkout-total">Total: <strong><span id="totalPrice"></span></strong></p>

        <form action="/wdd330/finalProject/success.html" for="checkout" name="checkout" id="checkout"
            class="checkout-form" method="get">
            <div class="contact">
                <label for="firstName" class="first-name">First name *</label>
                <input type="text" name="firstName" id="firstName" required>

                <label for="lastName" class="last-name">Last Name *</label>
                <input type="text" name="lastName" id="lastName" required>
            </div>

            <div class="address">
                <!--------------- STREET ADDRESS ---------------->
                <label for="address" class="streetAddress">Street Address *</label>
                <input type="text" name="address" id="address" required>

                <!--------------------- CITY  ------------------->
                <label for="city" class="cityName">City *</label>
                <input type="text" name="city" id="city" required>

                <!--------------------- STATE ------------------->
                <label for="state" class="stateName">State *</label>
                <input type="text" name="state" id="state" required>

                <!---------------------- ZIP CODE ---------------->
                <label for="zip" class="zip">Zip Code *</label>
                <input type="text" name="zip" id="zip" required>
            </div>

            <div class="payment">

                <!------------------------ CREDIT CARD NUMBER -------------------->
                <label for="credit-card" class="creditCard">Credit Card Number *</label>
                <input type="text" name="credit-card" id="credit-card" required minlength="12">

                <!------------------------ EXPIRE DATE -------------------->
                <label for="expire-date" class="expDate">Expiration Date *</label>
                <input type="text" name="expire-date" id="expire-date" required>

                <!------------------------ SECURITY CODE -------------------->
                <label for="sec-code" class="cvc">CVV number *</label>
                <input type="text" name="sec-code" id="sec-code" required minlength="3" maxlength="3">
            </div>

            <button type="submit" class="checkout-btn" id="checkoutSubmit">Checkout Now!</button>
        </form>
    </main>

    <footer>
        <p>©️ <span id="fullyear"></span> Josue Zenif Baez Gomez WDD 330</p>
        <p>|</p>
        <p>Valentía Fashion Mode</p>
        <p>|</p>
        <p id="lastModified"></p>
    </footer>

    <div class="footer-logo">
        <img src="images/transparent-logo.jpg" alt="Fashion mode logo">
    </div>

</body>

</html>
